<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pumpkin News</title>
    <link rel="stylesheet" href="styles.css?v=20260506b" />
    <script src="vendor/d3.min.js"></script>
    <script src="vendor/topojson-client.min.js"></script>
  </head>
  <body>
    <main class="atlas-shell">
      <section class="atlas-stage">
        <div class="atlas-hud atlas-hud--top">
          <p class="atlas-mark" id="cache-status-mark" title="Cache status loading">Pumpkin News</p>
        </div>

        <div class="atlas-canvas">
          <svg id="world-map" viewBox="0 0 1440 900" aria-label="Interactive globe"></svg>
        </div>

        <div class="atlas-hud atlas-hud--bottom">
        </div>

        <div class="layer-switches" aria-label="Map layers">
          <div class="layer-switch">
            <span class="layer-switch__text">Top Stories</span>
            <button
              class="layer-switch__toggle is-active"
              id="ai-picks-toggle"
              type="button"
              aria-pressed="true"
            >
              <span class="layer-switch__knob"></span>
            </button>
          </div>
          <div class="layer-switch">
            <span class="layer-switch__text">Live conflicts</span>
            <button
              class="layer-switch__toggle"
              id="conflict-toggle"
              type="button"
              aria-pressed="false"
            >
              <span class="layer-switch__knob"></span>
            </button>
          </div>
          <div class="layer-switch">
            <span class="layer-switch__text">Key Areas</span>
            <button
              class="layer-switch__toggle"
              id="important-toggle"
              type="button"
              aria-pressed="false"
            >
              <span class="layer-switch__knob"></span>
            </button>
          </div>
          <div class="layer-switch">
            <span class="layer-switch__text">US Carriers</span>
            <button
              class="layer-switch__toggle"
              id="carrier-toggle"
              type="button"
              aria-pressed="false"
            >
              <span class="layer-switch__knob"></span>
            </button>
          </div>
        </div>

        <div class="zoom-controls" aria-label="Globe zoom controls">
          <button class="more-top-stories" id="more-stories-hud" type="button">More Top Stories</button>
          <button class="zoom-control" id="zoom-out" type="button" aria-label="Zoom out">
            -
          </button>
          <button class="zoom-control" id="zoom-in" type="button" aria-label="Zoom in">
            +
          </button>
        </div>

        <svg id="connector-layer" aria-hidden="true"></svg>

        <div class="hotspot-popup is-hidden" id="hotspot-popup">
          <p class="hotspot-popup__label" id="popup-label"></p>
          <p class="hotspot-popup__conflict" id="popup-conflict"></p>
          <p class="hotspot-popup__countries" id="popup-countries"></p>
          <div class="hotspot-popup__market is-hidden" id="popup-market"></div>
          <a class="hotspot-popup__link is-hidden" id="popup-link" target="_blank" rel="noreferrer">View source ↗</a>
        </div>

        <aside class="country-sheet is-hidden" id="country-sheet">
          <button class="sheet-close" id="sheet-close" type="button" aria-label="Close country briefing">&#x2715;</button>

          <div class="sheet-inner">
            <p class="sheet-kicker" id="detail-region">Region</p>

            <h2 id="detail-country">Country</h2>

            <section class="fact-strip" aria-label="Country facts">
              <article class="fact-pill">
                <p class="fact-label" id="detail-democracy-label">Democracy index</p>
                <p class="fact-value" id="detail-democracy-index"></p>
              </article>
              <article class="fact-pill">
                <p class="fact-label" id="detail-economic-growth-label">Economic growth</p>
                <p class="fact-value" id="detail-economic-growth"></p>
              </article>
              <article class="fact-pill fact-pill--alert">
                <p class="fact-label" id="detail-conflict-label">Conflict status</p>
                <div class="fact-value conflict-list" id="detail-conflict"></div>
              </article>
            </section>

            <section class="story-section">
              <div class="spot-context is-hidden" id="spot-context"></div>
              <p class="section-label" id="story-section-label">Recent stories</p>
              <div class="story-list" id="story-list"></div>
              <button class="more-stories-button is-hidden" id="more-stories" type="button">More stories</button>
            </section>
          </div>
        </aside>
      </section>
    </main>

    <script src="data.js?v=20260505d"></script>
    <script src="app.js?v=20260506i"></script>
  </body>
</html>
